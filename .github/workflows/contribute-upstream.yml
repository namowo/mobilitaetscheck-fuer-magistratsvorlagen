name: Contribute to upstream

# Opens/updates a pull request to the upstream repository with everything on main that
# upstream does not have yet (without fork-only files, see the script's EXCLUDES).
# Requires the secret UPSTREAM_PR_TOKEN: a classic personal access token with the
# `public_repo` scope (a fork cannot open pull requests upstream with GITHUB_TOKEN).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"

concurrency:
  group: contribute-upstream
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Open or update upstream pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          UPSTREAM_REPO: ritmo-hsrm/mobilitaetscheck-fuer-magistratsvorlagen
          CONTRIB_BRANCH: contrib/upstream
          FORK_REF: origin/main
        run: .github/scripts/contribute-upstream.sh
