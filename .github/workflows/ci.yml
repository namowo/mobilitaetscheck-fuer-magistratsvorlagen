name: CI

# Checks every pull request against main. Make them required in the repository settings
# (Settings → Rules → Rulesets, or Branches → Branch protection rule for main → "Require status
# checks to pass") by selecting the job names below: Frontend, Backend, Docs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same as `npm run lint`, but without --fix so problems fail the check instead of being rewritten.
      - name: Lint (ESLint)
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore --max-warnings 0

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mobilitaetscheck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy settings so app.core.config.Settings can load without a .env file.
      DB_HOSTNAME: localhost
      DB_PORT: 5432
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_NAME: mobilitaetscheck_ci
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      MAIL_FROM: ci@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: localhost
      MAIL_FROM_NAME: CI
      MAIL_STARTTLS: "false"
      MAIL_SSL_TLS: "false"
      USE_CREDENTIALS: "false"
      VALIDATE_CERTS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml (same as the deploy).
      - name: Install dependencies
        run: uv sync --frozen

      # Only errors that break code at runtime: syntax errors and undefined names.
      - name: Lint (Ruff, fatal errors only)
        run: uvx ruff check --select E9,F63,F7,F82 --exclude '*.ipynb' --output-format github backend

      # app.main mounts FRONTEND_DIR (../frontend/dist) and fails at import if it is missing;
      # the frontend itself is built in the Frontend job, an empty directory is enough here.
      - name: Import application
        working-directory: backend
        run: |
          mkdir -p ../frontend/dist
          uv run python -c "import app.main"

      # Applies all migrations to an empty database, as the deploy does on the server.
      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Check single migration head
        working-directory: backend
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads. Add a merge migration."
            uv run alembic heads
            exit 1
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build documentation
        run: uv run mkdocs build --strict
